<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REBORN! 20TH ANNIVERSARY — FAN ART ARCHIVE</title>

<style>
/* =========================================================
   REBORN! 20TH ANNIVERSARY FAN ART ARCHIVE
   SINGLE HTML VERSION
   ========================================================= */

:root {
    --black: #080808;
    --black-2: #111111;
    --black-3: #181818;

    --gold: #b9954a;
    --gold-light: #d8bd78;
    --gold-dark: #765a29;

    --cream: #eee8dc;
    --paper: #f5f2eb;
    --paper-dark: #e5dfd3;

    --text: #e9e4da;
    --muted: #a49d91;

    --line: rgba(185,149,74,.45);

    --magazine-max-width: 1408px;

    --ease-page: cubic-bezier(.18,.72,.22,1);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    background:
        radial-gradient(circle at 50% 0%, rgba(185,149,74,.08), transparent 35%),
        linear-gradient(135deg, #070707, #121212 50%, #080808);

    color: var(--text);

    font-family:
        "Noto Serif TC",
        "Noto Serif CJK TC",
        "Times New Roman",
        serif;

    overflow-x: hidden;
}

button {
    font: inherit;
}

a {
    color: inherit;
    text-decoration: none;
}


/* =========================================================
   GLOBAL DECORATION
   ========================================================= */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    opacity: .12;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);

    background-size: 5px 5px, 5px 5px;

    mix-blend-mode: overlay;

    z-index: 999;
}


/* =========================================================
   TOP NAVIGATION
   ========================================================= */

.topbar {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 74px;

    display: grid;
    grid-template-columns: 1fr auto 1fr;

    align-items: center;

    padding: 0 42px;

    background:
        linear-gradient(
            180deg,
            rgba(5,5,5,.98),
            rgba(10,10,10,.93)
        );

    border-bottom: 1px solid rgba(185,149,74,.28);

    z-index: 1000;

    backdrop-filter: blur(12px);
}

.site-title {
    justify-self: start;

    font-size: 15px;
    letter-spacing: .24em;

    color: var(--gold-light);

    cursor: pointer;

    transition: color .3s ease;
}

.site-title:hover {
    color: #fff;
}

.home-button {
    justify-self: center;

    border: 0;
    background: transparent;

    color: #e5e0d7;

    font-size: 14px;
    letter-spacing: .18em;

    cursor: pointer;

    padding: 10px 25px;

    transition:
        color .3s ease,
        letter-spacing .3s ease;
}

.home-button:hover {
    color: var(--gold-light);
    letter-spacing: .25em;
}


/* ---------- 家族陣營 ---------- */

.index-wrapper {
    justify-self: end;

    position: relative;
}

.index-toggle {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 9px 0 9px 18px;

    color: var(--gold-light);

    background: transparent;
    border: 0;

    font-size: 13px;
    letter-spacing: .22em;

    cursor: pointer;
}

.index-toggle::after {
    content: "";

    width: 24px;
    height: 1px;

    background: var(--gold);

    transition:
        width .3s ease,
        background .3s ease;
}

.index-toggle:hover::after {
    width: 38px;
    background: #fff;
}

.index-menu {
    position: absolute;

    top: calc(100% + 15px);
    right: 0;

    width: 310px;

    padding: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(20,20,20,.98),
            rgba(7,7,7,.98)
        );

    border: 1px solid rgba(185,149,74,.48);

    box-shadow:
        0 25px 60px rgba(0,0,0,.65),
        inset 0 0 0 1px rgba(255,255,255,.025);

    opacity: 0;
    visibility: hidden;

    transform: translateY(-10px);

    transition:
        opacity .3s ease,
        transform .3s ease,
        visibility .3s ease;
}

.index-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.index-menu::before {
    content: "";

    position: absolute;

    top: -5px;
    right: 32px;

    width: 9px;
    height: 9px;

    background: #111;

    border-left: 1px solid var(--gold);
    border-top: 1px solid var(--gold);

    transform: rotate(45deg);
}

.index-menu-title {
    padding: 5px 8px 15px;

    color: var(--gold);

    font-size: 11px;
    letter-spacing: .3em;

    border-bottom: 1px solid rgba(185,149,74,.25);
}

.index-item {
    display: grid;

    grid-template-columns: 38px 1fr;

    align-items: center;

    min-height: 56px;

    padding: 8px;

    border-bottom: 1px solid rgba(255,255,255,.055);

    cursor: pointer;

    transition:
        background .3s ease,
        padding-left .3s ease;
}

.index-item:last-child {
    border-bottom: 0;
}

.index-item:hover {
    background: rgba(185,149,74,.08);
    padding-left: 14px;
}

.index-number {
    color: var(--gold);

    font-size: 12px;
    letter-spacing: .12em;
}

.index-name {
    font-size: 14px;
    color: #e8e2d8;
}

.index-name-en {
    display: block;

    margin-top: 3px;

    font-family: Arial, sans-serif;

    font-size: 8px;
    letter-spacing: .18em;

    color: #777269;
}


/* =========================================================
   HOME
   ========================================================= */

#home {
    min-height: 100vh;

    padding-top: 74px;

    background:
        radial-gradient(
            ellipse at 50% 18%,
            rgba(185,149,74,.11),
            transparent 40%
        ),
        linear-gradient(
            180deg,
            #090909 0%,
            #0d0d0d 48%,
            #080808 100%
        );
}


/* ---------- Hero ---------- */

.hero {
    position: relative;

    min-height: 82vh;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;
}

.hero::before {
    content: "";

    position: absolute;

    width: 760px;
    height: 760px;

    border: 1px solid rgba(185,149,74,.12);

    border-radius: 50%;

    box-shadow:
        0 0 0 50px rgba(185,149,74,.015),
        0 0 0 100px rgba(185,149,74,.01);

    transform: rotate(14deg);
}

.hero::after {
    content: "";

    position: absolute;

    width: 110%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(185,149,74,.45),
            transparent
        );

    bottom: 5%;
}

.hero-content {
    position: relative;

    z-index: 2;

    width: min(900px, 90vw);

    text-align: center;
}

.hero-kicker {
    margin-bottom: 20px;

    font-family: Arial, sans-serif;

    font-size: 11px;
    letter-spacing: .55em;

    color: var(--gold);

    text-transform: uppercase;
}

.hero-title {
    margin: 0;

    font-size: clamp(65px, 9vw, 145px);

    line-height: .8;

    letter-spacing: -.04em;

    color: #e8e1d4;

    text-shadow:
        0 2px 0 #000,
        0 15px 50px rgba(0,0,0,.8);
}

.hero-title span {
    color: var(--gold);
}

.hero-subtitle {
    margin-top: 32px;

    font-family: Arial, sans-serif;

    font-size: 12px;
    letter-spacing: .42em;

    color: #b8b0a4;
}

.hero-description {
    max-width: 520px;

    margin: 28px auto 0;

    font-size: 13px;

    line-height: 2;

    color: #817b71;
}

.hero-divider {
    width: 160px;
    height: 1px;

    margin: 30px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
}

.scroll-hint {
    margin-top: 50px;

    font-family: Arial, sans-serif;

    font-size: 9px;
    letter-spacing: .35em;

    color: #6e685e;
}


/* =========================================================
   FACTION LIST
   ========================================================= */

.factions-section {
    position: relative;

    width: min(1080px, 90vw);

    margin: 0 auto;

    padding:
        90px
        0
        160px;
}

.section-small-title {
    text-align: center;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .5em;

    color: #766f63;

    margin-bottom: 70px;
}

.faction-list {
    display: flex;
    flex-direction: column;

    gap: 30px;
}

.faction-card {
    position: relative;

    width: 76%;

    min-height: 190px;

    display: flex;

    align-items: center;

    cursor: pointer;

    border-top: 1px solid rgba(185,149,74,.23);
    border-bottom: 1px solid rgba(185,149,74,.12);

    transition:
        transform .5s var(--ease-page),
        border-color .3s ease;
}

.faction-card:nth-child(odd) {
    margin-left: 3%;
}

.faction-card:nth-child(even) {
    margin-left: auto;
    margin-right: 3%;

    flex-direction: row-reverse;

    text-align: right;
}

.faction-card:hover {
    transform: translateX(10px);
    border-color: rgba(185,149,74,.65);
}

.faction-card:nth-child(even):hover {
    transform: translateX(-10px);
}

.faction-emblem {
    width: 160px;
    height: 160px;

    flex: 0 0 160px;

    display: flex;

    align-items: center;
    justify-content: center;

    position: relative;
}

.faction-emblem::before {
    content: "";

    position: absolute;

    inset: 12px;

    border: 1px solid rgba(185,149,74,.32);

    transform: rotate(45deg);

    transition:
        transform .5s ease,
        border-color .3s ease;
}

.faction-card:hover .faction-emblem::before {
    transform: rotate(135deg);

    border-color: rgba(185,149,74,.7);
}

.faction-emblem img {
    width: 112px;
    height: 112px;

    object-fit: contain;

    position: relative;

    z-index: 2;

    filter:
        grayscale(.15)
        sepia(.2)
        brightness(.8);

    transition:
        transform .5s ease,
        filter .5s ease;
}

.faction-card:hover .faction-emblem img {
    transform: scale(1.07);

    filter:
        grayscale(0)
        sepia(.1)
        brightness(1);
}

.faction-info {
    flex: 1;

    padding: 20px 34px;
}

.faction-number {
    display: block;

    margin-bottom: 8px;

    font-family: Arial, sans-serif;

    font-size: 10px;
    letter-spacing: .25em;

    color: var(--gold);
}

.faction-name {
    margin: 0;

    font-size: clamp(27px, 3vw, 42px);

    font-weight: 500;

    letter-spacing: .08em;

    color: #e8e1d6;
}

.faction-name-en {
    margin-top: 10px;

    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .28em;

    color: #817a70;
}

.faction-count {
    margin-top: 17px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .2em;

    color: #5f5a53;
}


/* =========================================================
   READER
   ========================================================= */

#reader {
    display: none;

    min-height: 100vh;

    padding-top: 74px;

    background:
        radial-gradient(
            ellipse at center top,
            rgba(185,149,74,.09),
            transparent 42%
        ),
        #090909;
}

#reader.active {
    display: block;
}

.reader-header {
    width: min(1650px, 96vw);

    margin: 0 auto;

    padding: 28px 0 16px;

    display: flex;

    align-items: flex-end;
    justify-content: space-between;
}

.reader-category {
    font-size: 12px;

    letter-spacing: .28em;

    color: var(--gold);
}

.reader-category-en {
    margin-top: 5px;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .28em;

    color: #686159;
}

.reader-counter {
    font-family: Arial, sans-serif;

    font-size: 10px;

    letter-spacing: .2em;

    color: #686159;
}


/* =========================================================
   MAGAZINE
   ========================================================= */

.reader-stage {
    position: relative;

    width: 100%;

    display: flex;

    justify-content: center;

    padding:
        10px
        0
        70px;
}

.magazine {
    position: relative;

    /*
       每一頁固定使用 B5 直式比例：176 × 250 mm。
       整本打開後是兩張 B5 並排：352 × 250 mm。

       寬度同時受「瀏覽器寬度」與「瀏覽器高度」限制，
       所以不論螢幕尺寸怎麼變，都不會把 B5 比例拉壞。
    */

    width: min(94vw, var(--magazine-max-width), calc((100vh - 190px) * 352 / 250));

    height: auto;

    aspect-ratio: 352 / 250;

    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-columns: 1fr 1fr;

    perspective: 2800px;

    box-shadow:
        0 35px 45px rgba(0,0,0,.65);

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    transform-origin: center center;
}


/* ---------- 書背 ---------- */

.magazine::before {
    content: "";

    position: absolute;

    left: 50%;
    top: 0;

    width: 7px;
    height: 100%;

    transform: translateX(-50%);

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.045),
            rgba(0,0,0,.015),
            rgba(0,0,0,.045)
        );

    z-index: 80;

    pointer-events: none;
}


/* =========================================================
   B5 PAGE / FULL-BLEED IMAGE SLOTS
   ========================================================= */

/*
   每一張內頁都是獨立的 B5 頁面：
   176 × 250 mm。

   頁面本身不放任何文字、裝飾線、浮水印或背景圖案。
   只預留滿版圖片容器，之後可直接在容器內放入 <img>。
*/

.page,
.blank-page,
.full-bleed-page {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: #fff;
    color: #111;
}

.sheet-face > .page,
.sheet-face > .blank-page,
.sheet-face > .full-bleed-page {
    width: 100%;
    height: 100%;
}

/*
   滿版圖片預留區：
   沒有邊框、文字、陰影或裝飾。
   放入圖片後會自動填滿整個 B5 頁面。
*/
.full-bleed-image-slot {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.full-bleed-image-slot img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    border: 0;
    margin: 0;
    padding: 0;
}

/* =========================================================
   CHAPTER PAGE
   ========================================================= */

.chapter-page {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding:
        7%
        8%;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #f6f1e8 0%,
            #eee7da 48%,
            #e4dacb 100%
        );

    color: #28231c;
}

.chapter-page .chapter-inner-glow {
    position: absolute;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.22),
            transparent 58%
        );
}

.chapter-page::before {
    content: "";

    position: absolute;

    inset: 3.5%;

    border: 1px solid rgba(111,80,31,.58);

    pointer-events: none;
}

.chapter-page::after {
    content: "";

    position: absolute;

    inset: 5.4%;

    border: 1px solid rgba(111,80,31,.20);

    pointer-events: none;
}

.chapter-corner {
    position: absolute;

    width: 7%;
    height: 7%;

    max-width: 58px;
    max-height: 58px;

    min-width: 25px;
    min-height: 25px;

    border-color: #9a7737;
    border-style: solid;

    z-index: 3;
}

.chapter-corner.tl {
    top: 5.1%;
    left: 5.1%;

    border-width: 1px 0 0 1px;
}

.chapter-corner.tr {
    top: 5.1%;
    right: 5.1%;

    border-width: 1px 1px 0 0;
}

.chapter-corner.bl {
    bottom: 5.1%;
    left: 5.1%;

    border-width: 0 0 1px 1px;
}

.chapter-corner.br {
    bottom: 5.1%;
    right: 5.1%;

    border-width: 0 1px 1px 0;
}

.chapter-number {
    position: relative;

    z-index: 4;

    flex-shrink: 0;

    font-family: Arial, sans-serif;

    font-size: clamp(7px, .7vw, 11px);

    letter-spacing: .5em;

    color: #7c5c28;

    text-align: center;
}

.chapter-emblem {
    position: relative;

    width: min(28%, 190px);

    aspect-ratio: 1 / 1;

    margin:
        clamp(18px, 4%, 38px)
        0
        clamp(16px, 3.5%, 32px);

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    z-index: 4;
}

.chapter-emblem::before,
.chapter-emblem::after {
    content: "";

    position: absolute;

    width: 72%;
    height: 72%;

    border: 1px solid rgba(133,99,41,.38);

    transform: rotate(45deg);
}

.chapter-emblem::before {
    width: 88%;
    height: 88%;
}

.chapter-emblem::after {
    width: 68%;
    height: 68%;

    border-color: rgba(133,99,41,.22);
}

.chapter-emblem img {
    width: 58%;
    height: 58%;

    object-fit: contain;

    position: relative;

    z-index: 2;

    opacity: .9;

    filter:
        sepia(.35)
        contrast(.9);
}

.chapter-label {
    position: relative;

    z-index: 4;

    flex-shrink: 0;

    font-family: Arial, sans-serif;

    font-size: clamp(6px, .65vw, 10px);

    letter-spacing: .42em;

    color: #90713c;

    margin-bottom: clamp(7px, 1.4%, 15px);

    text-align: center;
}

.chapter-title {
    position: relative;

    z-index: 4;

    margin: 0;

    max-width: 88%;

    font-size: clamp(25px, 3.6vw, 62px);

    font-weight: 500;

    letter-spacing: .08em;

    line-height: 1.15;

    color: #28231c;

    text-align: center;

    overflow-wrap: anywhere;
}

.chapter-title-en {
    position: relative;

    z-index: 4;

    margin-top: clamp(7px, 1.1%, 13px);

    max-width: 82%;

    font-family: Arial, sans-serif;

    font-size: clamp(6px, .72vw, 11px);

    letter-spacing: .34em;

    line-height: 1.5;

    color: #766b5b;

    text-align: center;

    overflow-wrap: anywhere;
}

.chapter-rule {
    position: relative;

    z-index: 4;

    width: 22%;

    max-width: 135px;
    min-width: 65px;

    height: 1px;

    margin:
        clamp(14px, 2.6%, 28px)
        0
        clamp(9px, 1.5%, 18px);

    background:
        linear-gradient(
            90deg,
            transparent,
            #977334,
            transparent
        );
}

.chapter-count {
    position: relative;

    z-index: 4;

    flex-shrink: 0;

    font-family: Arial, sans-serif;

    font-size: clamp(6px, .58vw, 9px);

    letter-spacing: .28em;

    color: #877b6b;

    text-align: center;
}


/* =========================================================
   OPENING BLANK PAGE
   ========================================================= */

.opening-page {
    position: relative;

    background:
        radial-gradient(
            circle at 75% 25%,
            rgba(185,149,74,.10),
            transparent 35%
        ),
        #eee9df;

    display: flex;

    align-items: flex-end;
    justify-content: flex-end;

    padding: clamp(25px, 3.3%, 45px);

    overflow: hidden;
}

.opening-page::after {
    content: "";

    position: absolute;

    right: clamp(25px, 3.3%, 45px);
    bottom: clamp(25px, 3.3%, 45px);

    width: clamp(110px, 14%, 190px);
    height: clamp(110px, 14%, 190px);

    border: 1px solid rgba(120,90,42,.15);

    background:
        radial-gradient(
            circle,
            rgba(120,90,42,.06),
            transparent 70%
        );

    border-radius: 50%;
}

.opening-mark {
    position: relative;

    z-index: 2;

    font-family: Arial, sans-serif;

    font-size: clamp(7px, .65vw, 9px);

    letter-spacing: .3em;

    color: #857967;
}


/* =========================================================
   CHARACTER IMAGE PAGE
   ========================================================= */

.art-page {
    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 0;

    background: #f2efe8;

    overflow: hidden;
}


/* =========================================================
   ★ 直式 A4
   ★ 上下切齊頁面
   ★ 左右依比例自然留白
   ★ 不裁切 / 不變形 / 無裝飾
   ========================================================= */

.art-page:not(.landscape-art) .a4-frame {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background: transparent;

    min-width: 0;
    min-height: 0;
}

.art-page:not(.landscape-art) .a4-frame img {
    display: block;

    width: auto;
    height: 100%;

    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    object-position: center;

    box-shadow: none;
    border: 0;
}


/* =========================================================
   IMAGE PLACEHOLDER
   ========================================================= */

.image-placeholder {
    width: min(82%, 620px);

    max-height: 100%;

    aspect-ratio: 210 / 297;

    border: 1px solid rgba(70,60,48,.22);

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    color: #9a9287;

    font-family: Arial, sans-serif;

    font-size: clamp(7px, .7vw, 10px);

    letter-spacing: .22em;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.25),
            rgba(0,0,0,.015)
        );
}


/* =========================================================
   ★ 橫式 A4
   ★ 固定左下
   ★ 不使用動畫中的尺寸變化
   ★ 圖片一開始即保持完整
   ========================================================= */

.art-page.landscape-art {
    position: relative;

    display: block;

    padding: 0;

    overflow: visible;

    background: transparent;

    z-index: 30;
}


/*
   左頁本身的紙張背景。
   只填滿左側，不會延伸覆蓋右頁。
*/

.landscape-art::before {
    content: "";

    position: absolute;

    inset: 0;

    background: #f2efe8;

    z-index: -1;

    pointer-events: none;
}


/*
   橫式圖片容器：
   從翻頁一開始就固定在左下角。
*/

.landscape-art .a4-frame {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 200%;
    height: 100%;

    display: flex;

    align-items: flex-end;
    justify-content: flex-start;

    overflow: visible;

    min-width: 0;
    min-height: 0;

    pointer-events: none;

    z-index: 50;
}

.landscape-art .a4-frame img {
    display: block;

    position: absolute;

    left: 0;
    bottom: 0;

    width: auto;

    height: 100%;

    max-width: none;
    max-height: none;

    object-fit: contain;

    object-position: left bottom;

    box-shadow: none;
    border: 0;

    pointer-events: none;

    /*
       A4 landscape = 297 / 210 = 1.414
       高度 100% 時自然延伸到右側。
    */
}

.landscape-art .image-placeholder {
    display: none !important;
}


/*
   橫式 art sheet 及其兩面都不能裁切。
*/

.sheet:has(.landscape-art) {
    overflow: visible;
}

.sheet:has(.landscape-art) .sheet-face {
    overflow: visible;
}

.sheet:has(.landscape-art) .sheet-back {
    overflow: visible;
}

.info-content {

.landscape-info .info-watermark {

/* =========================================================
   PAGE SHEETS / 3D FLIP
   ========================================================= */

#sheets {
    position: absolute;

    inset: 0;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    pointer-events: none;
}

.sheet {
    position: absolute;

    top: 0;
    left: 50%;

    width: 50%;
    height: 100%;

    transform-origin: left center;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;

    transform: translateZ(0);

    transition:
        transform 1.35s var(--ease-page);

    z-index: 100;

    cursor: default;

    will-change: transform;

    box-shadow:
        -3px 3px 8px rgba(0,0,0,.055);

    pointer-events: none;
}

.sheet.flipped {
    transform:
        translateZ(0)
        rotateY(-180deg);
}

.sheet-face {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: var(--paper);

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
}

.sheet-back {
    transform:
        rotateY(180deg)
        translateZ(.01px);
}

.sheet:has(.landscape-art) .sheet-back {
    overflow: visible;
}


/*
   保留原本極淡的翻頁邊緣，
   但橫式圖片本身不會受到它影響。
*/

.sheet::after {
    content: "";

    position: absolute;

    top: 0;
    right: -2px;

    width: 3px;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.018),
            rgba(255,255,255,.35),
            rgba(0,0,0,.055)
        );

    z-index: 10;

    pointer-events: none;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}


/* =========================================================
   CLICK AREAS + ARROWS
   ========================================================= */

.page-click-left,
.page-click-right {
    position: absolute;

    top: 0;

    width: 50%;
    height: 100%;

    z-index: 1200;

    cursor: pointer;

    pointer-events: auto;

    display: flex;

    align-items: center;
}

.page-click-left {
    left: 0;

    justify-content: flex-start;
}

.page-click-right {
    right: 0;

    justify-content: flex-end;
}


/*
   左右箭頭。
   放在書本最外側的空白區。
*/

.page-click-left::before,
.page-click-right::before {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 42px;
    height: 80px;

    color: rgba(80,68,52,.48);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 46px;

    font-weight: 300;

    line-height: 1;

    opacity: .55;

    transition:
        opacity .3s ease,
        transform .3s ease,
        color .3s ease;

    pointer-events: none;
}

.page-click-left::before {
    content: "‹";

    margin-left: 8px;
}

.page-click-right::before {
    content: "›";

    margin-right: 8px;
}

.page-click-left:hover::before,
.page-click-right:hover::before {
    color: #806735;

    opacity: .9;
}

.page-click-left:hover::before {
    transform: translateX(-3px);
}

.page-click-right:hover::before {
    transform: translateX(3px);
}


/* =========================================================
   READER BOTTOM
   ========================================================= */

.reader-bottom {
    width: min(1000px, 80vw);

    margin: -30px auto 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}

.reader-progress {
    width: 100%;
    height: 1px;

    background: rgba(185,149,74,.15);

    overflow: hidden;
}

.reader-progress-fill {
    height: 100%;

    width: 0%;

    background: var(--gold);

    transition: width .6s ease;
}

.reader-page-count {
    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: .28em;

    color: #70695f;
}


/* =========================================================
   END / CATEGORY TRANSITION
   ========================================================= */

.category-transition {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(5,5,5,.94);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .4s ease,
        visibility .4s ease;

    z-index: 2000;
}

.category-transition.show {
    opacity: 1;
    visibility: visible;
}

.transition-inner {
    text-align: center;
}

.transition-number {
    font-family: Arial, sans-serif;

    font-size: 11px;

    letter-spacing: .4em;

    color: var(--gold);
}

.transition-title {
    margin-top: 20px;

    font-size: 40px;

    color: #eee8dd;
}

.transition-line {
    width: 100px;
    height: 1px;

    margin: 20px auto;

    background: var(--gold);
}

                `角色 ${number}`,

            nameEn:
                `CHARACTER ${number}`,

            image:
                `assets/works/${faction.id}/${number}.jpg`,

            orientation:

/* =========================================================
   建立翻頁紙
   =========================================================
   
   頁面結構：

   spread 0
   左：章節頁
   右：opening

   spread 1
   左：角色 01 圖片
   右：角色 01 介紹

   spread 2
   左：角色 02 圖片
   右：角色 02 介紹

   spread 3
   左：角色 03 圖片
   右：角色 03 介紹

   ...
   
   因此：
   currentSpread = 1 → 角色01
   currentSpread = 2 → 角色02
   currentSpread = 3 → 角色03

   左翻：
   03 → 02

   右翻：
   02 → 03
   ========================================================= */

function buildReader(faction) {

    sheetsContainer.innerHTML = "";
    sheets = [];

    /*
       翻書結構：

       初始畫面
       左頁：章節左頁（chapterImages[0]）
       右頁：章節右頁（chapterImages[1]）

       翻過章節頁後
       左頁：角色 01 左頁
       右頁：角色 01 右頁

       再翻一頁
       左頁：角色 02 左頁
       右頁：角色 02 右頁
       ……以此類推。

       因此每個陣營一定會先保留完整的「章節左右跨頁」，
       翻過這個跨頁後才會進入角色頁。
    */

    baseLeft.innerHTML =
        blankPageHTML(
            `${faction.id}-chapter-left`,
            faction.chapterImages?.[0] || "",
            faction.id
        );

    const characterCount = faction.characters.length;

    /*
       baseLeft = 章節左頁
       sheet 0 正面 = 章節右頁
       sheet 0 背面 = 角色01左頁
       sheet 1 正面 = 角色01右頁
       sheet 1 背面 = 角色02左頁
       ...
       最後一張 sheet 的背面保留純白，方便結束章節。
    */

    for (let i = 0; i <= characterCount; i++) {

        const sheet = document.createElement("div");
        sheet.className = "sheet";

        let frontHTML = "";
        let backHTML = "";

        if (i === 0) {
            frontHTML = blankPageHTML(
                `${faction.id}-chapter-right`,
                faction.chapterImages?.[1] || "",
                faction.id
            );
        } else {
            const rightImageIndex = (i - 1) * 2 + 1;
            frontHTML = blankPageHTML(
                `${faction.id}-character-${String(i).padStart(2, "0")}-right`,
                faction.pageImages?.[rightImageIndex] || "",
                faction.id
            );
        }

        if (i < characterCount) {
            const leftImageIndex = i * 2;
            backHTML = blankPageHTML(
                `${faction.id}-character-${String(i + 1).padStart(2, "0")}-left`,
                faction.pageImages?.[leftImageIndex] || "",
                faction.id
            );
        } else {
            backHTML = blankPageHTML(
                `${faction.id}-ending-blank`,
                "",
                faction.id
            );
        }

        sheet.innerHTML = `
            <div class="sheet-face">
                ${frontHTML}
            </div>
            <div class="sheet-face sheet-back">
                ${backHTML}
            </div>
        `;

        sheetsContainer.appendChild(sheet);
        sheets.push(sheet);
    }

    currentSpread = 0;
    isAnimating = false;

    sheets.forEach(sheet => {
        sheet.classList.remove("flipped");
    });

    updateSheetZ();
    updateReaderUI();
}


/* =========================================================
   空白 B5 頁面

function blankPageHTML(slotName, imageFile = "", factionId = "") {

    const imageSrc =

    return `

/* =========================================================
   SHEET Z-INDEX
   ========================================================= */

function updateSheetZ() {

    const total =
        sheets.length;


    sheets.forEach(
        (sheet, index) => {

            if (
                index < currentSpread
            ) {

                sheet.style.zIndex =
                    index + 10;

            } else {

                sheet.style.zIndex =
                    total + 20 - index;

            }

        }
    );

}


/* =========================================================
   NEXT PAGE
   ========================================================= */

function nextPage(event) {

    if (event) {

        event.preventDefault();
        event.stopPropagation();

    }


    if (isAnimating) {
        return;
    }


    const faction =
        factions[currentFactionIndex];


    const maxSpread =
        faction.characters.length;


    /*
       已經在最後一位角色，
       再按右邊 → 下一個家族。
    */

    if (
        currentSpread >= maxSpread
    ) {

        nextFaction();

        return;

    }


    const sheet =
        sheets[currentSpread];


    if (!sheet) {
        return;
    }


    isAnimating = true;


    /*
       目前的 sheet 從右頁翻到左頁。
    */

    sheet.style.zIndex =
        sheets.length + 100;


    sheet.classList.add("flipped");


    playFlipSound();


    currentSpread++;


    updateReaderUI();


    setTimeout(
        () => {

            updateSheetZ();

            isAnimating = false;

        },
        1400
    );

}


/* =========================================================
   PREVIOUS PAGE
   ========================================================= */

function previousPage(event) {

    if (event) {

        event.preventDefault();
        event.stopPropagation();

    }


    if (isAnimating) {
        return;
    }


    /*
       在章節頁再按左邊：
       回到上一個家族。
    */

    if (
        currentSpread <= 0
    ) {

        previousFaction();

        return;

    }


    /*
       例如：
       角色 03 → 角色 02

       currentSpread = 3

       要解除的是：
       sheets[2]

       也就是角色 03 所在的翻頁紙。
    */

    const sheet =
        sheets[currentSpread - 1];


    if (!sheet) {
        return;
    }


    isAnimating = true;


    /*
       回翻時暫時放到最上層，
       避免被其他 sheet 蓋住。
    */

    sheet.style.zIndex =
        sheets.length + 100;


    sheet.classList.remove("flipped");


    playFlipSound();


    currentSpread--;


    updateReaderUI();


    setTimeout(
        () => {

            updateSheetZ();

            isAnimating = false;

        },
        1400
    );

}


/* =========================================================
   CATEGORY
   ========================================================= */

function openFaction(index) {

    closeIndex();


    currentFactionIndex =
        Math.max(
            0,
            Math.min(

                factions.length - 1
            )

    const faction =
        factions[currentFactionIndex];


    home.style.display =
        "none";


    reader.classList.add("active");


    readerCategory.textContent =
        faction.name;


    readerCategoryEn.textContent =
        faction.nameEn;


    buildReader(faction);


    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

}


/* =========================================================
   NEXT FACTION
   ========================================================= */

function nextFaction() {

    if (
        currentFactionIndex >=
        factions.length - 1
    ) {

        goHome();

        return;

    }


    showTransition(
        currentFactionIndex + 1,
        () => {

            currentFactionIndex++;

            buildReader(
                factions[
                    currentFactionIndex
                ]
            );

        }
    );

}


/* =========================================================
   PREVIOUS FACTION
   ========================================================= */

function previousFaction() {

    if (
        currentFactionIndex <= 0
    ) {

        goHome();

        return;

    }


    showTransition(
        currentFactionIndex - 1,
        () => {

            currentFactionIndex--;

            buildReader(
                factions[
                    currentFactionIndex
                ]
            );

        }
    );

}

        document.getElementById(

        );

    title.textContent =

    setTimeout(

        },

    );

/* =========================================================
   UI
   ========================================================= */

function updateReaderUI() {

    const faction =
        factions[currentFactionIndex];


    const total =
        faction.characters.length + 1;


    readerCategory.textContent =
        faction.name;


    readerCategoryEn.textContent =
        faction.nameEn;


    readerCounter.textContent =
        `${String(
            currentSpread
        ).padStart(2, "0")} / ${String(
            faction.characters.length
        ).padStart(2, "0")}`;


    readerPageCount.textContent =
        `SPREAD ${String(
            currentSpread + 1
        ).padStart(2, "0")} / ${String(
            total
        ).padStart(2, "0")}`;


    const percentage =
        total <= 1
        ? 100
        : (
            currentSpread /
            (total - 1)
        ) * 100;


    readerProgress.style.width =
        `${percentage}%`;


    clickLeft.style.pointerEvents =
        "auto";


    clickRight.style.pointerEvents =
        "auto";

}


/* =========================================================
   FLIP SOUND
   ========================================================= */

let audioContext = null;


function playFlipSound() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const duration =
            .18;


        const buffer =
            audioContext.createBuffer(
                1,
                audioContext.sampleRate *
                    duration,
                audioContext.sampleRate
            );


        const data =
            buffer.getChannelData(0);


        for (
            let i = 0;
            i < data.length;
            i++
        ) {

            const envelope =
                1 -
                i / data.length;


            data[i] =
                (
                    Math.random() * 2 - 1
                ) *
                envelope *
                .35;

        }


        const source =
            audioContext.createBufferSource();


        const filter =
            audioContext.createBiquadFilter();


        const gain =
            audioContext.createGain();


        filter.type =
            "bandpass";


        filter.frequency.value =
            1800;


        filter.Q.value =
            .65;


        gain.gain.value =
            .18;


        source.buffer =
            buffer;


        source
            .connect(filter)
            .connect(gain)
            .connect(
                audioContext.destination
            );


        source.start();

    }

    catch (error) {

        console.log(
            "Page sound unavailable."
        );

    }

}


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            !reader.classList.contains(
                "active"
            )
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();

            nextPage();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            previousPage();

        }


        if (
            event.key ===
            "Escape"
        ) {

            goHome();

        }

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

buildFactionList();

buildIndexMenu();

</script>

</body>
</html>
